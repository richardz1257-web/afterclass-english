:#eef2f7;border-radius:9px;color:#465b77;font-size:13px;margin:20px 0}.notice.warning{background:#fff0db;color:#755021}.error-message{color:var(--bad);font-size:13px;margin-top:12px}.progress-table{width:100%;border-collapse:collapse}.progress-table td,.progress-table th{padding:17px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}.progress-table th{font-size:12px;color:var(--muted);font-weight:500}.progress-table progress{max-width:150px}.table-wrap{overflow-x:auto}.empty{padding:50px 24px;text-align:center}.empty h2{font-size:30px}.empty p{color:var(--muted);max-width:50ch;margin:14px auto}.history-row{padding:18px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;font-size:14px}.history-row p{font-size:12px;color:var(--muted);margin-top:5px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.settings-grid h2{font-size:26px}.file-label{display:block;font-size:13px;margin:20px 0 9px}input[type=file]{max-width:100%;font-size:13px}input[type=file]::file-selector-button{border:1px solid #b7c5d7;padding:10px 12px;border-radius:7px;background:#e8eef6;color:var(--ink);margin-right:10px;cursor:pointer}.draft-preview{white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto;font-family:Georgia,serif}.review-item{padding:24px 0;border-top:1px solid var(--line)}.review-item:first-child{border-top:0}.review-item h3{margin:8px 0}.review-item p{font-size:13px}.mobile-menu{display:none}footer{border-top:1px solid var(--line);margin:0 48px;padding:22px 0;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.skip{position:fixed;top:-80px;left:16px;background:white;z-index:50;padding:10px}.skip:focus{top:10px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--deep);color:white;padding:12px 22px;border-radius:9px;z-index:30;box-shadow:0 6px 20px #17233722;opacity:0;pointer-events:none;transition:.2s;max const UNITS = [
{title:'Find your voice',zh:'融入校园',level:'A2 → B1',words:[['clarify','澄清；说明','Could you clarify the instructions?'],['participate','参与','I want to participate in the discussion.'],['perspective','观点；视角','Her perspective helped me understand the story.'],['evidence','证据','Use evidence from the text to support your answer.']],grammar:'Polite requests · 礼貌提问',rule:'用 Could you + 动词原形提出请求。Could you explain...? 比 Explain... 更礼貌。ask someone to do something 表示请某人做某事。',gq:[['Could you ___ the last step?',['explaining','explain','explained'],1,'Could 是情态动词，后接动词原形 explain。'],['Which request is most appropriate for a teacher?',['Give me the answer.','You must help now.','Could you explain what this word means?'],2,'具体、礼貌地说明需要解释的内容。'],['I asked my partner ___ the paragraph.',['to read','reading','reads'],0,'ask someone to do something：请某人做某事。']],reading:'On her first day at a new school, Lena knew the answer to a question but kept her hand down. She worried that everyone would notice her accent. During group work, a classmate asked what she thought. Lena described a detail the others had missed. Her idea changed the group’s answer. At the end of class, she wrote one goal in her notebook: tomorrow, ask one question. She did not need perfect English to contribute; she needed a small opening.',rq:[['Why does Lena stay quiet at first?',['She did not read the text.','She worries about her accent.','She dislikes her classmates.'],1,'文中直接说她担心别人注意到她的口音。'],['Which detail best shows that Lena contributes?',['Her idea changes the group’s answer.','She carries a notebook.','She is new at school.'],0,'观点改变小组答案，直接证明她作出了贡献。'],['Which theme best fits the passage?',['Always agree with your group.','Perfect English is necessary.','Small acts of participation can build confidence.'],2,'她从不举手到定下提问目标，体现小步参与带来信心。']],audio:'Hi, everyone. For tomorrow, please read pages twelve through eighteen. You do not need to answer all the questions. Choose one question and write a short response using a detail from the text. We will discuss your ideas with partners before the quiz on Friday.',lq:[['What should students read?',['Pages 12–18','Pages 18–20','Chapter 12'],0,'听力说 pages twelve through eighteen。'],['How many questions should they answer?',['All of them','One','Three'],1,'老师说 Choose one question。'],['What happens before the quiz?',['A class trip','A spelling test','A partner discussion'],2,'先和同伴讨论，再参加周五测验。']],speak:'Ask a teacher for help with an assignment. Say what you understand, identify one confusing part, and ask a specific question.',frames:['I understand that we need to…','I’m not sure how to…','Could you explain…?'],write:'Write a short email to a teacher asking for clarification about an assignment. Include a greeting, what you understand, one specific question, and a polite closing.',sample:'Hello Ms. Rivera,\nI understand that we need to explain the character’s choice. I’m not sure how many details from the story we should include. Could you clarify whether one example is enough?\nThank you for your help,\nA student',checks:['I included a greeting and a polite closing.','I explained what I already understand.','I asked one specific question.']},
{title:'Build a strong claim',zh:'观点与证据',level:'B1',words:[['claim','主张；论点','A strong claim can be supported with evidence.'],['relevant','相关的','Choose a relevant example.'],['justify','证明合理；说明理由','Can you justify your choice?'],['counterargument','反方观点','Consider a counterargument before your conclusion.']],grammar:'Because, although & however · 逻辑连接',rule:'because 引出原因；although 引出让步；however 是连接副词。两个完整句子可用句号分开，再写 However, ...。不要把 although 和 but 在同一结构里重复使用。',gq:[['___ the library is small, it is useful.',['Because of','Although','However'],1,'Although + 完整从句，表示“虽然”。'],['Choose the correctly punctuated sentence.',['It was late, however we continued.','It was late. However, we continued.','It was late however, we continued.'],1,'用句号结束前一句，However 后加逗号。'],['We need more shade ___ the playground gets hot.',['because','although','however'],0,'操场热是需要遮阴的原因。']],reading:'The student council proposed keeping the library open for an extra hour. Supporters argued that students who share a bedroom may lack a quiet place to study at home. A survey of eighty students found that thirty wanted to use the extra time twice a week. Critics pointed out that the school would need to pay a staff member. The council suggested a two-week trial on Tuesdays and Thursdays. Attendance records could help the school decide whether the benefit justified the cost.',rq:[['What is the main proposal?',['Build a new library.','Keep the library open longer.','Replace teachers with students.'],1,'提案是延长图书馆开放时间一小时。'],['What concern do critics raise?',['Students dislike reading.','Books are too expensive.','Additional staffing costs.'],2,'反方指出需要支付值班人员费用。'],['Why suggest a trial?',['To collect evidence before a permanent decision.','To avoid collecting data.','To close the library early.'],0,'试行出勤记录可帮助判断收益是否值得成本。']],audio:'I agree that a longer lunch break would give us time to relax. However, I’m concerned about moving the end of the school day later. Could we test the schedule for one week and ask both teachers and students for feedback? That would give us more evidence before we make a permanent change.',lq:[['What benefit does the speaker recognize?',['Less homework','Time to relax','Earlier dismissal'],1,'a longer lunch break would give us time to relax。'],['What worries the speaker?',['A later end to the school day','Too many surveys','A shorter lunch'],0,'担忧是放学时间变晚。'],['What does the speaker propose?',['Changing permanently today','Cancelling lunch','A one-week trial'],2,'test the schedule for one week。']],speak:'Should your school offer a quiet study room after school? State your claim, give a reason and an example, and acknowledge one concern.',frames:['I believe… because…','For example,…','One concern is… However,…'],write:'Write an argument paragraph about whether a school should offer a quiet study room after school. Include a claim, a reason, an example, and a response to one concern. Mark invented examples as hypothetical.',sample:'Schools should offer a quiet study room after school because some students cannot concentrate at home. For example, a student who shares a bedroom might need a place to review notes. Staffing would cost money, but a short trial could show whether enough students would benefit. A limited schedule would be a reasonable first step.',checks:['My claim answers the question.','I explained why my example supports my claim.','I acknowledged a concern without inventing research.']},
{title:'Read between the lines',zh:'阅读推断',level:'B1',words:[['infer','推断','We can infer how she feels from her actions.'],['reluctant','不情愿的','He was reluctant to speak first.'],['contrast','对比','The author contrasts two reactions.'],['reveal','揭示','The final scene reveals her motivation.']],grammar:'Past simple & past continuous · 叙事时态',rule:'过去进行时 was/were + 动词-ing 表示当时正在进行的动作；一般过去时描述已发生的事件。I was reading when the bell rang.',gq:[['I ___ my notes when the bell rang.',['was reviewing','review','am reviewing'],0,'铃响时正在复习，使用过去进行时。'],['While they were talking, Maya ___ the door.',['opens','opened','opening'],1,'opened 表示在背景动作中发生的事件。'],['Which sentence describes a completed past event?',['She is waiting.','She was waiting.','She left at three.'],2,'left at three 是明确完成的过去事件。']],reading:'When the final debate list appeared, Jonah scanned it twice. His name was beside “opening speaker.” He folded the page and pushed it deep into his backpack. At lunch, he asked Mara how she prepared for speeches, pretending that he was asking for a friend. That evening, he stood in front of a mirror with three note cards. The first sentence came out quietly. He started again, this time lifting his eyes from the cards.',rq:[['What can we infer about Jonah?',['He is nervous but willing to prepare.','He plans to miss the debate.','He has no interest in speaking.'],0,'藏起名单、借口替朋友问，都暗示紧张；镜前练习说明愿意准备。'],['Which detail most clearly shows preparation?',['Scanning the list twice','Practicing with note cards','Putting the page away'],1,'用提示卡练习演讲是直接的准备行为。'],['Why does the author include “asking for a friend”?',['To introduce a new friend','To show Jonah’s confidence','To suggest Jonah hides his worry'],2,'他不想承认自己需要帮助，因此说是替朋友问。']],audio:'Yesterday, I was looking for my science notes when I found an old speech I wrote last year. I remembered how nervous I had been. This time, I practiced with a friend instead of memorizing every word. During the presentation, I forgot one sentence, but I explained the idea in a different way and kept going.',lq:[['What was the speaker looking for?',['An old speech','Science notes','A phone'],1,'开头说 looking for my science notes。'],['How did the speaker prepare this time?',['By practicing with a friend','By avoiding practice','By memorizing every word'],0,'这次与朋友练习，而不是逐字记忆。'],['What happened after forgetting a sentence?',['They stopped completely.','They left the room.','They rephrased the idea.'],2,'explained the idea in a different way = 换一种说法。']],speak:'Retell a time when you tried something difficult. Describe what was happening, what you did, and what you learned.',frames:['I was… when…','At first, I felt…','After that, I…'],write:'Write a short scene in which a character feels nervous without using the word “nervous.” Show the feeling through actions and details, then add a sentence explaining your choices.',sample:'Mia smoothed the corner of her note card for the fourth time. When her name was called, she stood too quickly and bumped the desk. She paused, took a breath, and looked at a friendly face in the audience.\nThe repeated movements and sudden mistake suggest her uneasiness without naming it.',checks:['My scene uses concrete actions or details.','I kept past-tense verbs consistent.','I explained how a detail reveals the feeling.']},
{title:'Explain how it works',zh:'学科学习',level:'B1',words:[['variable','变量','Change only one variable in the experiment.'],['observe','观察','Observe the plants for a week.'],['consistent','一致的','Keep the amount of water consistent.'],['conclusion','结论','Our conclusion must match the results.']],grammar:'Comparisons & quantity · 比较与数量',rule:'比较级 + than 用于比较。可数名词复数用 fewer（更少）；不可数名词用 less。比较某个结果不代表已经证明因果关系。',gq:[['Plant A grew ___ than Plant B.',['tallest','taller','more tall'],1,'tall 的比较级是 taller。'],['The second container had ___ water.',['fewer','many','less'],2,'water 不可数，用 less。'],['We observed ___ leaves on Plant B.',['fewer','less','much'],0,'leaves 是可数名词复数，用 fewer。']],reading:'A class tested how light affected bean plants. The students used the same kind of seeds, identical pots, and equal amounts of water. One group received six hours of light each day; another received three. After two weeks, the first group had a greater average height. However, there were only four plants in each group. The students concluded that longer light exposure was associated with more growth in this trial. They recommended repeating the experiment with more plants before making a broad claim.',rq:[['Which variable did students change?',['Type of seed','Hours of light','Amount of water'],1,'两组区别是每天六小时与三小时光照。'],['Why mention only four plants per group?',['To explain a limitation','To prove every plant is identical','To show the result is impossible'],0,'样本较小，限制了结论可推广的范围。'],['What conclusion best matches the text?',['More light always helps every plant.','Water has no effect on plants.','The longer-light group grew more in this trial.'],2,'限定在本次实验，避免把有限结果过度概括。']],audio:'Before you start, label both cups. Add the same amount of soil to each cup, and place two seeds in each. Keep the water and temperature the same. Put one cup near the window and the other on the shaded shelf. Measure the height every Monday, not every day, and record your results in centimeters.',lq:[['What should studen /* Pure state validation: imports are reconstructed, never copied into prototypes. */
const Progress = (() => {
  const key='afterclass.progress.v1';
  const skills=['vocabulary','grammar','reading','listening','speaking','writing'];
  const validId=id=>typeof id==='string' && /^[0-5]-(vocabulary|grammar|reading|listening|speaking|writing)$/.test(id);
  const expectedTotal=id=>id.endsWith('-vocabulary')?4:/(speaking|writing)$/.test(id)?0:3;
  const fresh=()=>({app:'afterclass',version:1,results:{},drafts:{},attempts:[],updatedAt:new Date().toISOString()});
  const obj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  const date=v=>typeof v==='string'&&v.length<40&&Number.isFinite(Date.parse(v));
  function validate(raw){
    if(!obj(raw)||raw.app!=='afterclass'||raw.version!==1||!obj(raw.results)||!obj(raw.drafts)||!Array.isArray(raw.attempts))throw Error('这不是受支持的 Afterclass 进度文件（需要版本 1）。');
    if(raw.attempts.length>10000||Object.keys(raw.results).length>36||Object.keys(raw.drafts).length>36)throw Error('文件中的记录数量异常。');
    const out=fresh();
    for(const [id,r] of Object.entries(raw.results)){
      if(!validId(id)||!obj(r)||!Number.isInteger(r.score)||!Number.isInteger(r.total)||r.total<0||r.total!==expectedTotal(id)||r.score<0||r.score>r.total||!date(r.at)||!Array.isArray(r.wrong)||!r.wrong.every(n=>Number.isInteger(n)&&n>=0&&n<r.total))throw Error('文件中的练习记录格式不正确。');
      out.results[id]={score:r.score,total:r.total,at:r.at,wrong:[...new Set(r.wrong)],completed:r.completed===true};
    }
    for(const [id,d] of Object.entries(raw.drafts)){
      if(!validId(id)||!obj(d)||typeof d.text!=='string'||d.text.length>20000||!date(d.at))throw Error('文件中的草稿格式不正确。');
      out.drafts[id]={text:d.text,at:d.at};
    }
    for(const a of raw.attempts){
      if(!obj(a)||!validId(a.lesson)||typeof a.id!=='string'||a.id.length>100||!date(a.at)||!Number.isInteger(a.score)||!Number.isInteger(a.total)||a.score<0||a.total<0||a.total!==expectedTotal(a.lesson)||a.score>a.total)throw Error('文件中的学习历史格式不正确。');
      out.attempts.push({id:a.id,lesson:a.lesson,at:a.at,score:a.score,total:a.total});
    }
    out.updatedAt=date(raw.updatedAt)?raw.updatedAt:out.updatedAt;
    return out;
  }
  function merge(current,incoming){
    const a=validate(current),b=validate(incoming),out=fresh();
    for(const name of ['results','drafts'])for(const source of [a[name],b[name]])for(const [id,item] of Object.entries(source))if(!out[name][id]||Date.parse(item.at)>Date.parse(out[name][id].at))out[name][id]=item;
    const seen=new Map();
    for(const item of [...a.attempts,...b.attempts])if(!seen.has(item.id))seen.set(item.id,item);
    out.attempts=[...seen.values()].sort((x,y)=>Date.parse(x.at)-Date.parse(y.at)).slice(-10000);
    return out;
  }
  function day(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function streak(attempts,now=new Date()){
    const days=new Set(attempts.map(a=>day(new Date(a.at))));const d=new Date(now);let n=0;
    if(!days.has(day(d)))d.setDate(d.getDate()-1);
    while(days.has(day(d))){n++;d.setDate(d.getDate()-1);}
    return n;
  }
  return {key,fresh,validate,merge,validId,day,streak,skills};
})();

function questions(u,s){const unit=UNITS[u];if(s==='vocabulary')return unit.words.map((w,i)=>{const right=(u+i)%4;const opts=unit.words.map(x=>x[1]);const correct=opts.splice(i,1)[0];opts.splice(right,0,correct);return [`What does “${w[0]}” mean in this context? “${w[2]}”`,opts,right,`${w[0]} 表示“${w[1]}”。例句：${w[2]}`];});return unit[s==='grammar'?'gq':s==='reading'?'rq':'lq'];}
function lesson(u,sid){const unit=UNITS[u],s=skillBy(sid);$('#main').innerHTML=`<a class="back" href="#${sid}">← 返回${s.zh}主题</a><div class="lesson-heading"><div><h1 lang="en">${unit.title}</h1><p class="muted">${s.en} · ${s.zh} / ${unit.zh}</p></div><span class="tag">建议 ${s.minutes} 分钟</span></div><div class="lesson-grid"><section class="panel lesson-content" id="lesson-body"></section><aside class="lesson-note"><h3>把练习变成习惯</h3><ol><li>先自己尝试，再看提示。</li><li>理解原因，不只记答案。</li><li>离开页面前，查看保存状态。</li></ol><hr class="divider"><p>所有材料为原创练习。口语和写作通过自查完成，不计为客观能力分数。</p><a class="btn text" href="#home">查看我的计划</a></aside></div>`;

 if(sid==='listening')material=`<h2>Listen for the details.</h2><p class="muted small">先听一遍抓住主题，再听一遍记细节。使用设备的英文语音合成，非真人录音。</p><div class="audio-toolbar"><button class="btn" data-say="${esc(unit.audio)}">播放听力</button><button class="btn outline" data-stop-speech>停止</button><label>速度 <select id="rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option></select></label></div><p id="speech-status" class="small muted" role="status"></p><details><summary>听完后查看原文 / 无法播放时阅读</summary><div class="transcript" lang="en">${unit.audio}</div></details>`;
 body.innerHTML=material+`<div class="quiz-title"><h2>Check your understanding</h2><p class="small muted">完成所有题目后提交。答错的题会自动加入复习。</p></div><form id="quiz">${questions(u,sid).map((q,i)=>`<fieldset class="question"><legend lang="en">${i+1}. ${q[0]}</legend>${q[1].map((a,j)=>`<label class="answer-option"><input type="radio" name="q${i}" value="${j}" required><span lang="en">${a}</span></label>`).join('')}<div id="feedback-${i}"></div></fieldset>`).join('')}<button class="btn" type="submit">提交并查看解析</button><p class="error-message" id="quiz-error" role="alert"></p></form><div id="result" aria-live="polite"></div>`;
 $('#quiz').addEventListener('submit',e=>{e.preventDefault();const qs=questions(u,sid),form=new FormData(e.target);if(qs.some((_,i)=>!form.has('q'+i))){$('#quiz-error').textContent='请先回答全部题目。';return;}const wrong=[];qs.forEach((q,i)=>{const correct=+form.get('q'+i)===q[2];if(!correct)wrong.push(i);$(`#feedback-${i}`).innerHTML=`<div class="feedback ${correct?'correct':''}"><strong>${correct?'回答正确':'再看一下'} · ${esc(q[1][q[2]])}</strong>${esc(q[3])}</div>`;});const score=qs.length-wrong.length;record(u,sid,score,qs.length,wrong);e.target.querySelectorAll('input,button').forEach(x=>x.disabled=true);$('#result').innerHTML=`<div class="result"><h3>${score} / ${qs.length} 题正确</h3><p>${wrong.length?'错题已加入复习。先读解析，再试着解释自己的错误。':'这次全部答对了。试试把今天学到的表达用进一句话。'}</p><div class="actions"><a class="btn" href="#home">继续学习计划</a><button class="btn outline" id="retry">重新练习</button>${wrong.length?'<a class="btn outline" href="#review">去复习错题</a>':''}</div></div>`;$('#retry').onclick=render;toast(storageOK&&!corruptRaw?'练习记录已保存':'练习已记录在本次页面，请立即导出备份');});bindSpeech();}
function record(u,s,score,total,wrong=[]){const id=lessonId(u,s),at=new Date().toISOString();state.results[id]={score,total,wrong,at,completed:true};state.attempts.push({id:typeof crypto.randomUUID==='function'?crypto.randomUUID():at+'-'+Math.random().toString(36).slice(2),lesson:id,at,score,total});state.attempts=state.attempts.slice(-10000);save();}
function production(u,s){const unit=UNITS[u],id=lessonId(u,s),isWriting=s==='writing';const checks=isWriting?unit.checks:['I spoke aloud and answered the whole prompt.','I used at least two useful phrases or examples.','I noticed one thing to improve and tried again.'];

e="checkbox" name="self${i}"><span lang="en">${c}</span></label>`).join('')}</div><div class="actions"><button class="btn" id="finish-production">记录本次完成</button></div><p id="production-error" class="error-message" role="alert"></p><div id="production-result" aria-live="polite"></div>`;
 const updateCount=()=>$('#word-count').textContent=`${countWords($('#draft').value)} words`;updateCount();
 $('#draft').addEventListener('input',()=>{state.drafts[id]={text:$('#draft').value,at:new Date().toISOString()};save();updateCount();});
 $('#writing-check').onclick=()=>{const text=$('#draft').value.trim(),count=countWords(text);const sentences=(text.match(/[^.!?]+[.!?]+/g)||[]).length;const linking=/\b(because|however|although|therefore|for example|first|then|finally|if)\b/i.test(text);$('#writing-feedback').innerHTML=`<div class="notice"><strong>规则检查提示（不检查事实或语法准确性）</strong><p>${count<30?'篇幅较短：先把主要想法写完整。':count>160?'篇幅较长：检查是否有可以删去的重复内容。':'篇幅已经足够展开一个想法。'} 检测到 ${count} 个英文单词、${sentences} 个带结束标点的句子。</p><p>${linking?'检测到连接词。检查它是否准确表达因果、转折或顺序。':'可以考虑用 because、however 或 for example 连接观点。'}</p><p>再对照下方清单，自己检查是否回答了题目，以及例子是否支持观点。</p></div>`;};
 $('#finish-production').onclick=()=>{if(![...document.querySelectorAll('#self-checks input')].every(x=>x.checked)){$('#production-error').textContent='请先完成并勾选全部自查项目。';return;}if(isWriting&&countWords($('#draft').value)<30){$('#production-error').textContent='请先写至少 30 个英文单词，再完成自查。';return;}state.drafts[id]={text:$('#draft').value,at:new Date().toISOString()};record(u,s,0,0);$('#production-error').textContent='';$('#finish-production').disabled=true;$('#production-result').innerHTML='<div class="result"><h3>练习已完成</h3><p>已记录为自查完成，不计入选择题正确率。</p><a class="btn" href="#home">继续学习计划</a></div>';toast(storageOK&&!corruptRaw?'草稿和练习记录已保存':'请立即导出备份以保留本次记录');};
 if(!isWriting){$('#timer-toggle').onclick=()=>{if(timerHandle){clearInterval(timerHandle);timerHandle=null;$('#timer-toggle').textContent='继续计时';}else{timerHandle=setInterval(()=>{timerSeconds++;if($('#timer'))$('#timer').textContent=`${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}`;},1000);$('#timer-toggle').textContent='暂停计时';}};$('#timer-reset').onclick=()=>{clearInterval(timerHandle);timerHandle=null;timerSeconds=0;$('#timer').textContent='00:00';$('#timer-toggle').textContent='开始计时';};bindRecording();}bindSpeech();}
function countWords(text){return (text.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]).length;}
function bindSpeech(){document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));document.querySelectorAll('[data-stop-speech]').forEach(b=>b.onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();if($('#speech-status'))$('#speech-status').textContent='已停止播放';});}
function speak(text){if(!('speechSynthesis'in window)){toast('此浏览器不支持语音播放，请查看原文。');return;}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-US';const voices=speechSynthesis.getVoices();utterance.voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null;utterance.rate=Number($('#rate')?.value||.9);utterance.onstart=()=>{if($('#speech-status'))$('#speech-status').textContent='正在播放 · English';};utterance.onend=()=>{if($('#speech-status'))$('#speech-status').textContent='播放结束，可再次播放';};utterance.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('语音播放失败，请检查设备英文语音或查看原文。');};speechSynthesis.speak(utterance);}
function bindRecording(){const start=$('#record-audio'),stop=$('#stop-audio'),status=$('#record-status'),audio=$('#playback');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){start.disabled=true;status.textContent='当前浏览器或连接不支持录音。仍可使用跟读和计时练习。';return;}start.onclick=async()=>{start.disabled=true;status.textContent='等待麦克风许可…';const currentRoute=route;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(route!==currentRoute){stream.getTracks().forEach(t=>t.stop());return;}mediaStream=stream;const chunks=[];const recorder=new MediaRecorder(stream);mediaRecorder=recorder;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(route!==currentRoute)return;if(recordingUrl)URL.revokeObjectURL(recordingUrl);recordingUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));audio.src=recordingUrl;audio.hidden=false;status.textContent='录音完成，可以回听。音频只保留在本页。';stop.disabled=true;start.disabled=false;};recorder.start();stop.disabled=false;status.textContent='正在录音，完成后点击停止。';}catch(e){status.textContent='无法使用麦克风。你可以允许权限后重试，或直接开口练习。';start.disabled=false;}};stop.onclick=()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop();};}
function reviewPage(){const items=Object.entries(state.results).flatMap(([id,r])=>r.wrong.map(q=>({id,q})));$('#main').innerHTML=intro('Turn mistakes into progress.','这里保留每节练习最近一次作答的错题。重新练习并答对后，对应错题会自动移除。')+(items.length?`<section class="panel">${items.map(({id,q})=>{const [u,s]=id.split('-'),data=questions(+u,s)[q];return `<article class="review-item"><span class="tag">${UNITS[+u].zh} · ${skillBy(s).zh}</span><h3 lang="en">${esc(data[0])}</h3><details><summary>回想后查看答案与解释</summary><p><strong>${esc(data[1][data[2]])}</strong></p><p>${esc(data[3])}</p></details><a class="btn outline small" href="#lesson/${u}/${s}">重新练习这一节</a></article>`;}).join('')}</section>`:'<section class="panel empty"><h2>A fresh page.</h2><p>目前没有待复习错题。完成选择题练习后，需要巩固的内容会出现在这里。</p><a class="btn" href="#home">开始练习</a></section>');}
function progressPage(){const total=Object.values(state.results).filter(r=>r.completed).length;const scored=state.attempts.filter(a=>a.total>0);const denominator=scored.reduce((n,a)=>n+a.total,0),numerator=scored.reduce((n,a)=>n+a.score,0);$('#main').innerHTML=intro('Look how far you’ve come.','完成记录反映练习投入，不等同于英语水平测评。')+`<div class="daily-band"><p><strong>${total} / 36 节完成</strong> · 连续 ${Progress.streak(state.attempts)} 天</p><p>${denominator?`历次选择题正确率 ${Math.round(numerator/denominator*100)}%`:'还没有选择题成绩'}</p></div><section class="panel"><h2>Six skills, one voice.</h2><div class="table-wrap"><table class="progress-table"><thead><tr><th>学习领域</th><th>完成</th><th>进度</th></tr></thead><tbody>${SKILLS.map(s=>{const count=UNITS.filter((_,i)=>done(lessonId(i,s.id))).length;return `<tr><td><a href="#${s.id}">${s.en} · ${s.zh}</a></td><td>${count} / 6</td><td><progress value="${count}" max="6" aria-label="${s.zh}完成进度"></progress></td></tr>`;}).join('')}</tbody></table></div></section><div class="section-heading"><h2>最近练习</h2><a href="#settings" class="small">导出全部进度</a></div>${state.attempts.length?state.attempts.slice(-20).reverse().map(a=>{const [u,s]=a.lesson.split('-');return `<div class="history-row"><div><a href="#lesson/${u}/${s}">${UNITS[+u].title} · ${skillBy(s).zh}</a><p>${new Date(a.at).toLocaleString('zh-CN')}</p></div><span>${a.total?`${a.score}/${a.total} 正确`:'自查完成'}</span></div>`;}).join(''):'<p class="notice">还没有完成记录。完成第一节练习后，再回来看看。</p>'}<div class="section-heading"><h2>我的草稿</h2></div>${Object.entries(state.drafts).filter(([,d])=>d.text.trim()).map(([id,d])=>{const [u,s]=id.split('-');return `<details><summary>${UNITS[+u].zh} · ${skillBy(s).zh} · ${countWords(d.text)} words</summary><p class="draft-preview">${esc(d.text)}</p><a class="btn text small" href="#lesson/${u}/${s}">继续编辑</a></details>`;}).join('')||'<p class="muted small">口语笔记和写作草稿会自动出现在这里。</p>'}`;}
function download(data,name,type='application/json'){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function settingsPage(){pendingImport=null;$('#main').innerHTML=intro('Your progress, yours to keep.','导出一份备份，就能把进度和草稿带到另一台设备。')+`<div class="notice">数据保存在当前浏览器、当前网站地址下，不会自动同步到云端。清除浏览器数据、使用无痕模式或更换网址，都可能失去本地记录。上线后请从旧网址导出，再到新网址导入。</div><div class="settings-grid"><section class="panel"><h2>导出进度</h2><p class="muted small">包含完成记录、最近错题、学习历史、写作草稿和口语笔记。不包含录音。</p><div class="actions"><button class="btn" id="export">下载 JSON 备份</button></div><p class="small muted">当前 ${Object.keys(state.results).length} 节练习记录，${Object.keys(state.drafts).length} 份草稿。</p></section><section class="panel"><h2>导入进度</h2><p class="muted small">选择本站导出的 JSON。先检查文件，再合并记录：同一节的结果和草稿保留更新时间较新的一份。</p><label class="file-label" for="import-file">选择进度文件（最多 2 MB）</label><input id="import-file" type="file" accept=".json,application/json"><div id="import-preview" aria-live="polite"></div><p class="error-message" id="import-error" role="alert"></p></section></div><div class="section-heading"><h2>使用说明</h2></div><details><summary>听力和口语如何工作？</summary><p>听力使用浏览器的英文语音合成；声音与可用性取决于设备。口语可计时、跟读、录音回听并自查，不提供自动发音评分。录音需要 HTTPS 或 localhost 和麦克风许可。</p></details><details><summary>学习计划如何安排？</summary><p>每个主题分两组：词汇＋阅读＋口语；语法＋听力＋写作。每组建议 25 分钟。完成后进入下一组，也可以从导航自由选课。全站共有 6 个主题、36 节练习。</p></details><details><summary>写作检查会做什么？</summary><p>统计英文单词、句子结束标点和常见连接词，再提示你对照任务自查。它不是 AI 批改，不判断事实、逻辑或语法是否正确。</p></details>`;
 $('#export').onclick=()=>{download(JSON.stringify(state,null,2),`afterclass-progress-${Progress.day()}.json`);toast('已生成进度备份，请保留下载的 JSON 文件');};
 $('#import-file').onchange=async e=>{pendingImport=null;$('#import-error').textContent='';$('#import-preview').innerHTML='';const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('文件超过 2 MB，请选择本站导出的进度文件。');pendingImport=Progress.validate(JSON.parse(await file.text()));$('#import-preview').innerHTML=`<p class="notice">文件有效：${Object.keys(pendingImport.results).length} 节记录、${Object.keys(pendingImport.drafts).length} 份草稿、${pendingImport.attempts.length} 次练习。</p><button class="btn" id="confirm-import">合并到当前进度</button>`;$('#confirm-import').onclick=()=>{try{const merged=Progress.merge(state,pendingImport);if(!storageOK)throw Error('当前浏览器存储不可用，不能安全导入。请在正常模式下重新打开网站。');if(corruptRaw)localStorage.setItem(Progress.key+'.corrupt-backup',corruptRaw);localStorage.setItem(Progress.key,JSON.stringify(merged));state=merged;corruptRaw=null;loadError='';pendingImport=null;$('#save-state').textContent='已保存到此浏览器';settingsPage();toast('导入完成，进度与草稿已合并保存');}catch(err){$('#import-error').textContent=err.message;}};}catch(err){$('#import-error').textContent=err instanceof SyntaxError?'文件不是有效的 JSON。原有进度未改变。':err.message;}};
}
$('.skip').onclick=e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView({behavior:'instant'});};
$('#menu').onclick=()=>{const open=$('#navigation').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open));$('#menu').textContent=open?'收起导航':'打开导航';};
window.addEventListener('hashchange',render);
window.addEventListener('storage',e=>{if(e.key===Progress.key&&e.newValue){try{state=Progress.merge(state,Progress.validate(JSON.parse(e.newValue)));toast('已接收另一个标签页的进度；当前输入会继续保存。');}catch(_){toast('另一标签页的进度格式异常，未合并。');}}});
window.addEventListener('pagehide',cleanMedia);
render();
</script></body></html>
